plugins { id 'com.android.application' }

def vc = (project.findProperty('vCode') ?: '1').toInteger()

android {
    namespace 'com.chispa.control'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chispa.control'
        minSdk 26
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }
    signingConfigs {
        release {
            storeFile file('../chispa-control.jks')
            storePassword 'chispa123'
            keyAlias 'chispa'
            keyPassword 'chispa123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
